[package]
name = "ipview-rs"
version = "0.1.0"
edition = "2024"
description = "Analyzer for Alcatel-Lucent OmniPCX Enterprise VoIP tickets (IP*.DAT / .ipv), a rewrite of IPView 2.0.1"
license = "MIT OR Apache-2.0"

[lib]
name = "ipview"
path = "src/lib.rs"

[[bin]]
name = "ipview"
path = "src/main.rs"

[[bin]]
name = "ipview-gui"
path = "src/bin/ipview-gui/main.rs"
required-features = ["gui"]

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
clap = { version = "4.6.7", features = ["derive"] }
csv = "1.4.0"
eframe = { version = "0.37.0", default-features = false, features = ["default_fonts", "glow", "wayland", "x11", "persistence"], optional = true }
egui_extras = { version = "0.37.0", optional = true }
image = { version = "0.25.10", default-features = false, features = ["png"], optional = true }
rfd = { version = "0.17.2", optional = true }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[features]
default = ["gui"]
gui = ["dep:eframe", "dep:egui_extras", "dep:rfd", "dep:image"]

[profile.release]
strip = true
